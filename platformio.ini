; Legacy Tape firmware: PlatformIO build (the same configuration CI runs).
;
; The Arduino sketch lives in legacytape_arduino/ because the Arduino IDE
; needs the .ino inside a folder of the same name. PlatformIO builds that
; same folder, so both toolchains share one source tree.
;
;   pio run                        build the production firmware
;   pio run -e crowpanel-dev       UI-only build with LT_DEV_MODE=1 (see README)
;   pio run -t upload -t monitor   flash, then open the serial monitor

[platformio]
src_dir = legacytape_arduino
default_envs = crowpanel

[env]
; pioarduino platform 51.03.07 = Arduino-ESP32 core 3.0.7 (ESP-IDF 5.1)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
framework = arduino
; ESP32-S3-WROOM-1-N16R8: 16 MB QIO flash, 8 MB OPI PSRAM
; (Arduino IDE: "ESP32S3 Dev Module", Flash Size 16MB, PSRAM "OPI PSRAM")
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = legacytape_arduino/partitions.csv
upload_speed = 921600
monitor_speed = 115200
build_flags =
    -D BOARD_HAS_PSRAM
    ; Serial over USB CDC (Arduino IDE: "USB CDC On Boot: Enabled")
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; LVGL takes its configuration from include/lv_conf.h
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
lib_deps =
    https://github.com/lvgl/lvgl.git#v8.3.11
    https://github.com/lovyan03/LovyanGFX.git#1.2.32
    https://github.com/bblanchon/ArduinoJson.git#v7.4.3

[env:crowpanel]

; Walk all 14 screens without the companion app: skips pairing/BLE/WiFi and
; never starts the mic, uploads or playback.
[env:crowpanel-dev]
build_flags =
    ${env.build_flags}
    -D LT_DEV_MODE=1
